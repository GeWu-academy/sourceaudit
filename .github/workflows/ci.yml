name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 回归自测 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: 跑语料回归
        run: npm test
      # 自扫 bin/lib/scripts/test（corpus 是故意埋洞的样本，engine 是规则表本身，都不扫）
      # 期望 0 命中：设计使然的点已标 nosec，新增命中说明真有新问题
      - name: 自扫本仓库源码
        run: node bin/sourceaudit.js bin lib scripts test/run.js --no-color --fail-on low

  engine:
    name: 引擎与元信息一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: 校验 ENGINE.json 与引擎文件匹配
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const meta = JSON.parse(fs.readFileSync("engine/ENGINE.json", "utf8"));
            const buf = fs.readFileSync("engine/awdpplus.js");
            const sha = crypto.createHash("sha256").update(buf).digest("hex");
            if (sha !== meta.source_sha256) {
              console.error("引擎文件与 ENGINE.json 指纹不一致：");
              console.error("  ENGINE.json:", meta.source_sha256);
              console.error("  实际文件  :", sha);
              process.exit(1);
            }
            console.log("引擎指纹一致:", sha.slice(0, 12), "规则", meta.rules.total, "条");
          '
      - name: 规则统计
        run: node bin/sourceaudit.js --list-rules
